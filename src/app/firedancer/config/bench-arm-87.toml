# 87-tile config: same tile counts as bench-arm-max.toml, blocklist fixed
# for this machine (2 NUMA nodes, not the 4-node box the original assumed).

[hugetlbfs]
  max_page_size = "huge"

[accounts]
  max_accounts = 131072

[runtime]
  max_live_slots = 512
  max_fork_width = 16

[layout]
  affinity = "auto"
  blocklist_cores = "0-7"
  net_tile_count = 1
  quic_tile_count = 1
  resolv_tile_count = 1
  verify_tile_count = 32
  gossvf_tile_count = 1
  execle_tile_count = 2
  execrp_tile_count = 2
  shred_tile_count = 1
  sign_tile_count = 2

[net]
  provider = "socket"

[development.genesis]
  fund_initial_accounts = 1024

[development.bench]
  benchg_tile_count = 16
  benchs_tile_count = 2

[tiles.shred]
  max_pending_shred_sets = 512

[tiles.gui]
  enabled = false

[tiles.event]
  url = ""

[tiles.pack]
  schedule_strategy = "perf"
